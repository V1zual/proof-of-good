services:
  - type: web
    name: proofofgood
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_web.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: SANDBOX_BUYER
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: POG_DATA
        value: /tmp/pog
