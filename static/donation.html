<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your donation — Proof of Good</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap" id="app"><p class="muted" style="padding:40px 0">Loading…</p></div>
<script src="/static/app.js"></script>
<script>
(async () => {
  const id = location.pathname.split("/").pop();
  const [cfg, r] = await Promise.all([config(), api("/api/donations/" + id).catch(() => null)]);
  if (!r) { $("#app").innerHTML = header("") + `<div class="card" style="margin-top:30px"><h3>Donation not found</h3><p class="muted">The demo server restarts now and then and forgets test donations. <a href="/">Back to campaigns</a></p></div>` + footer(cfg); return; }
  const d = r.donation, c = r.campaign;
  const partHtml = (p) => {
    if (p.state === "refunded") return `<li class="rejected"><div class="n">↩</div><div class="t-head"><div><b>Refunded to your PayPal</b> ${badge("refunded")}</div><div class="t-amt">${money(p.amount)}</div></div>
      <div class="t-sum">No verified proof arrived, so PayPal returned your money.</div></li>`;
    if (p.state === "surplus") return `<li><div class="n">+</div><div class="t-head"><div><b>Above the goal</b> ${badge("surplus")}</div><div class="t-amt">${money(p.amount)}</div></div>
      <div class="t-sum">Held for the volunteer's next verified purchase, or refunded.</div></li>`;
    const t = p.detail || {};
    let body = "";
    if (p.state === "paid") body = `<div class="t-sum">${esc((t.verdict && t.verdict.summary) || "")}</div>${proofsHtml(t.proofs)}
      <div class="small muted" style="margin-top:6px">Released to ${esc(c.volunteer_name)} with PayPal payout <span class="mono">${esc(t.paid_batch || "")}</span> · ${t.paid_at ? when(t.paid_at) : ""}</div>`;
    else if (p.state === "verified") body = `<div class="t-sum">The proof is approved; it is paid out as soon as the tranche is fully funded.</div>${proofsHtml(t.proofs)}`;
    else if (p.state === "rejected") body = `<div class="t-sum">The first proof was rejected by the AI auditor — your money stays held until real proof arrives.</div>`;
    else body = `<div class="t-sum">Held on PayPal. Nobody has this money yet — it waits for the receipt and the photo.</div>`;
    return `<li class="${p.state}"><div class="n">${p.state === "paid" ? "✓" : "•"}</div><div class="t-head"><div><b>${esc(p.title)}</b> ${badge(p.state)}</div><div class="t-amt">${money(p.amount)}</div></div>${body}</li>`;
  };
  $("#app").innerHTML = header("") + `
  <section style="padding:30px 0 20px"><div class="eyebrow">Your donation</div>
    <h1 class="display" style="margin-top:10px">${money(d.amount)} <span style="font-size:.5em;color:var(--muted)">to</span></h1>
    <p class="lead" style="margin-top:6px"><a href="/c/${c.id}">${icon(c)} ${esc(c.title)}</a> · ${esc(c.place)}</p>
    <p class="small muted">${d.donor_name ? esc(d.donor_name) + " · " : ""}${when(d.created)} · PayPal capture <span class="mono">${esc(d.id)}</span></p></section>
  <div class="two">
    <div class="card"><h3>Where your money is now</h3><p class="small muted" style="margin:2px 0 18px">Donations fill the tranches in order. This is the part that is yours.</p>
      <ol class="timeline">${r.parts.map(partHtml).join("")}</ol></div>
    <div class="sticky">
      <div class="card"><h3>The whole campaign</h3>${moneyBar(r.totals)}</div>
      ${cfg.bot ? `<div class="card"><h3>Get the photo when it's spent</h3><p class="small muted" style="margin:6px 0 12px">Telegram sends you the proof the moment your money is released.</p>
        <a class="btn ghost" href="https://t.me/${cfg.bot}?start=follow_${c.id}">Follow in Telegram</a></div>` : ""}
      <div class="card"><h3>Keep this link</h3><p class="small muted" style="margin:6px 0 0">This page always shows what happened to your money.</p></div>
    </div>
  </div>` + footer(cfg);
})();
</script>
</body>
</html>
