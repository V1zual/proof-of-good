<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your donation · Proof of Good</title>
<meta name="description" content="Where your Proof of Good donation is now: held on PayPal, on the volunteer's transparent card, spent and proven, or refunded.">
<meta name="robots" content="noindex">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap" id="app"></div>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
<script>
(async () => {
  document.title = L("Your donation") + " · Proof of Good";
  const id = location.pathname.split("/").pop();
  const [cfg, r] = await Promise.all([config(), api("/api/donations/" + id).catch(() => null)]);
  if (!r) {
    $("#app").innerHTML = header("") + `<main id="main" class="page-head">${emptyHtml("magnifying-glass", L("Donation not found"),
      L("The demo server restarts now and then and forgets test donations. {a}Open the campaigns{z} to give again.", { a: '<a href="/campaigns">', z: "</a>" }))}</main>` + footer(cfg);
    return;
  }
  const d = r.donation, c = r.campaign, name = esc(tr(c.volunteer_name));
  const partHtml = (p) => {
    if (p.state === "refunded") return `<li class="refunded"><div class="n">${ph("arrow-u-up-left")}</div><div class="t-head"><div><b>${L("Refunded to your PayPal")}</b> ${badge("refunded")}</div><div class="t-amt">${money(p.amount)}</div></div>
      <div class="t-sum">${L("No verified proof arrived, so PayPal returned your money.")}</div></li>`;
    if (p.state === "surplus") return `<li><div class="n">${ph("plus")}</div><div class="t-head"><div><b>${L("Above the goal")}</b> ${badge("surplus")}</div><div class="t-amt">${money(p.amount)}</div></div>
      <div class="t-sum">${L("Held for the volunteer's next verified purchase, or refunded.")}</div></li>`;
    const t = p.detail || {};
    let body = "";
    if (p.state === "accounted") body = `<div class="t-sum">${dyn((t.verdict && t.verdict.summary) || "")}</div>${proofsHtml(t.proofs)}
      ${t.payments && t.payments.length ? `<ul class="txs">${t.payments.map((x) => txHtml(x)).join("")}</ul>` : ""}
      <div class="xs muted mt-8">${L("Spent from {name}'s transparent card and proven", { name })} · ${t.accounted_at ? when(t.accounted_at) : ""}</div>`;
    else if (p.state === "released") body = `<div class="t-sum">${L("On {name}'s transparent card now. Every payment from it shows up here, checked by the AI auditor.", { name })}</div>
      ${t.payments && t.payments.length ? `<ul class="txs">${t.payments.map((x) => txHtml(x)).join("")}</ul>` : ""}`;
    else body = `<div class="t-sum">${L("Held on PayPal. Nobody has this money yet. It goes to the card when the budget lines before it are spent and proven.")}</div>`;
    return `<li class="${p.state}"><div class="n">${p.state === "accounted" ? ph("check") : ph("circle")}</div><div class="t-head"><div><b>${dyn(p.title)}</b> ${badge(p.state)}</div><div class="t-amt">${money(p.amount)}</div></div>${body}</li>`;
  };
  $("#app").innerHTML = header("") + `<main id="main">
  <section class="page-head"><div class="eyebrow">${L("Your donation")}</div>
    <h1 class="display">${L("{amount} to {title}", { amount: money(d.amount), title: dyn(c.title) })}</h1>
    <p class="lead">${icon(c)} <a href="/c/${c.id}">${L("Open the campaign page")}</a> · ${dyn(c.place)}</p>
    <p class="small muted mt-8">${d.donor_name ? esc(d.donor_name) + " · " : ""}${when(d.created)} · ${L("PayPal capture")} <span class="mono">${esc(d.id)}</span></p></section>
  <div class="two">
    <div class="card">${c.status === "frozen" ? `<div class="note bad mb-16">${ph("snowflake")}<b>${L("Spending frozen:")}</b> ${dyn(c.frozen_reason || "")}. ${L("Your held share goes back to you.")}</div>` : ""}
      <h3>${L("Where your money is now")}</h3><p class="small muted mt-4 mb-16">${L("Donations fill the budget lines in order. This is the part that is yours.")}</p>
      <ol class="timeline">${r.parts.map(partHtml).join("")}</ol></div>
    <aside class="sticky" aria-label="${esc(L("Campaign"))}">
      <div class="card"><h3>${L("The whole campaign")}</h3>${moneyBar(r.totals)}</div>
      ${cfg.bot ? `<div class="card"><h3>${L("Get the photo when it is spent")}</h3><p class="small muted mt-4 mb-12">${L("Telegram sends you the proof the moment your money is released.")}</p>
        <a class="btn ghost" href="https://t.me/${cfg.bot}?start=follow_${c.id}">${ph("telegram-logo")}${L("Follow in Telegram")}</a></div>` : ""}
      <div class="card"><h3>${L("Keep this link")}</h3><p class="small muted mt-4">${L("This page always shows what happened to your money.")}</p></div>
    </aside>
  </div></main>` + footer(cfg);
})().catch(failPage);
</script>
</body>
</html>
