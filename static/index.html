<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof of Good — donations released only after proof</title>
<meta name="description" content="Donations held on PayPal and released to volunteers only after an AI auditor verifies the receipt and the photo. No proof — automatic refunds.">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="/static/app.js"></script>
<script>
(async () => {
  const [cfg, list] = await Promise.all([config(), api("/api/campaigns")]);
  const sum = (k) => list.reduce((s, c) => s + c.totals[k], 0);
  $("#app").innerHTML = header("home") + `
  <section class="hero">
    <div>
      <div class="eyebrow">Donations with receipts</div>
      <h1 class="display" style="margin-top:14px">Donate to people,<br>not to promises.</h1>
      <p class="lead" style="margin-top:18px">Your money waits on PayPal and reaches the volunteer one tranche at a time, on a transparent card:
      every payment from it is visible and checked by an AI auditor the moment it happens. Spent on the purpose and proven with a photo — the next tranche comes. Misused — the rest goes back to you.</p>
      <div class="cta"><a class="btn" href="#campaigns">Give to a campaign</a><a class="btn ghost" href="/c/try">🧪 Try the whole flow in 2 minutes</a></div>
    </div>
    <div class="demo hide-sm" aria-hidden="true"><div class="card">
      <div class="eyebrow" style="margin-bottom:12px">The transparent card, live</div>
      <div class="row"><div class="paper"></div><div class="snap">⚡</div>
        <div class="small muted">$900 released to the volunteer's card for a generator</div></div>
      <ol>
        <li>−₴39,700 at a hardware store — matches the generator</li>
        <li>Photo: the same Hyundai generator, in the hospital</li>
        <li>Taken today · never used before</li>
        <li>Tranche accounted for — donors get the photo</li>
        <li class="pay"><b>$120 released</b> for fuel, the next tranche</li>
      </ol>
    </div></div>
  </section>

  <div class="stats">
    <div><b>${money0(sum("raised"))}</b><span>donated</span></div>
    <div><b>${money0(sum("held"))}</b><span>held on PayPal</span></div>
    <div><b>${money0(sum("accounted"))}</b><span>spent &amp; proven</span></div>
    <div><b>${money0(sum("refunded"))}</b><span>refunded to donors</span></div>
  </div>

  <section class="block" id="campaigns">
    <h2 class="h2">Open campaigns</h2>
    <div class="grid">${list.map((c) => {
      const paid = c.tranches.filter((t) => t.status === "accounted").length;
      return `<a class="card" href="/c/${c.id}">
        <div class="camp-icon">${icon(c)}</div>
        <h3>${esc(c.title)}</h3><div class="place">📍 ${esc(c.place)} · ${esc(c.volunteer_name)}</div>
        ${moneyBar(c.totals)}
        <div class="small muted" style="margin-top:10px">${paid} of ${c.tranches.length} tranches spent &amp; proven ·
          ${c.status === "active" ? '<span class="badge ok">active</span>' : `<span class="badge ${c.status === "completed" ? "ok" : "bad"}">${c.status}</span>`}</div>
      </a>`; }).join("")}</div>
  </section>

  <section class="block" id="how">
    <h2 class="h2">How the money moves</h2>
    <div class="card flow"><svg viewBox="0 0 980 250" role="img" aria-label="Donor pays with PayPal; the money is held; one tranche at a time goes to the volunteer's transparent card; the bank reports every payment and the AI auditor checks it; spent and proven releases the next tranche, misuse freezes the card and refunds the rest to donors.">
      <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
      <rect class="box" x="10" y="85" width="150" height="80" rx="14"/><text x="85" y="120" text-anchor="middle">💙 Donor</text><text class="sub" x="85" y="141" text-anchor="middle">PayPal or any card</text>
      <rect class="box" x="210" y="85" width="170" height="80" rx="14" style="stroke:var(--amber)"/><text x="295" y="120" text-anchor="middle">Held on PayPal</text><text class="sub" x="295" y="141" text-anchor="middle">Orders v2 · captured</text>
      <rect class="box" x="430" y="85" width="180" height="80" rx="14" style="stroke:var(--blue)"/><text x="520" y="120" text-anchor="middle">💳 Transparent card</text><text class="sub" x="520" y="141" text-anchor="middle">one tranche · Payouts v1</text>
      <rect class="box" x="660" y="85" width="150" height="80" rx="14" style="stroke:var(--blue)"/><text x="735" y="120" text-anchor="middle">🤖 AI auditor</text><text class="sub" x="735" y="141" text-anchor="middle">bank feed · photo</text>
      <rect class="box" x="850" y="20" width="120" height="80" rx="14" style="stroke:var(--green)"/><text x="910" y="55" text-anchor="middle">Next tranche</text><text class="sub" x="910" y="76" text-anchor="middle">spent &amp; proven</text>
      <rect class="box" x="850" y="150" width="120" height="80" rx="14" style="stroke:var(--red)"/><text x="910" y="185" text-anchor="middle">Refund</text><text class="sub" x="910" y="206" text-anchor="middle">Refunds v2</text>
      <line class="a" x1="160" y1="125" x2="206" y2="125" stroke-width="2.5" marker-end="url(#ar)"/>
      <line class="a" x1="380" y1="125" x2="426" y2="125" stroke-width="2.5" marker-end="url(#ar)"/>
      <line x1="610" y1="125" x2="656" y2="125" stroke-width="2.5" marker-end="url(#ar)" style="stroke:var(--blue)"/>
      <path class="g" d="M810 112 C832 112 832 60 846 60" fill="none" stroke-width="2.5" marker-end="url(#ar)"/>
      <path class="r" d="M810 138 C832 138 832 190 846 190" fill="none" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/>
      <text class="sub" x="520" y="200" text-anchor="middle">every payment from the card is reported by the bank</text>
    </svg></div>
    <div class="steps" style="margin-top:18px">
      <div><i>1</i><b>Give</b><span>Pay with PayPal or any bank card. The money is captured and held — nobody has it yet.</span></div>
      <div><i>2</i><b>One tranche to the card</b><span>The first part of the budget goes to the volunteer's transparent card — no own money needed to start.</span></div>
      <div><i>3</i><b>Every payment checked</b><span>The bank reports each card payment; the AI matches it to the purpose. Cash, transfers, a night out — frozen at once.</span></div>
      <div><i>4</i><b>Photo → next tranche</b><span>A photo of what was bought proves the tranche, then the next one comes. Misuse: the rest is refunded.</span></div>
    </div>
  </section>

  <section class="block">
    <h2 class="h2">What the AI auditor checks</h2>
    <div class="two">
      <div class="card"><ul class="checks" style="font-size:15px">
        <li class="ok"><b>Every card payment</b> — the merchant and its category from the bank: does it sell what this tranche is for?</li>
        <li class="ok"><b>Money leaving the purpose</b> — cash withdrawals, card-to-card transfers, gambling, bars: the card freezes at once.</li>
        <li class="ok"><b>Unclear payments</b> — cash on delivery at Nova Poshta, a marketplace: the receipt must show the same sum and the item.</li>
        <li class="ok"><b>The photo shows the item</b> — the same kind, brand or model as bought, where it is used.</li>
        <li class="ok"><b>The photo is a photo</b> — not a screenshot, a catalogue picture or an AI render (C2PA credentials too), taken after the money came.</li>
        <li class="ok"><b>Nothing is recycled</b> — perceptual hashing catches a picture already used as proof anywhere on the platform.</li>
      </ul></div>
      <div class="card"><h3>Why this matters</h3>
        <p class="muted" style="margin:8px 0 0">After every disaster, fake fundraisers appear — and honest volunteers lose donors' trust. Big charities can afford audits;
        a volunteer raising money for one generator can't. With an ordinary bank «jar» a volunteer can take everything and vanish.
        Here they never hold more than one tranche, every payment is public, and the rest goes back to donors if anything goes wrong.</p></div>
    </div>
  </section>` + footer(cfg);
})();
</script>
</body>
</html>
