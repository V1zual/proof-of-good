<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof of Good — donations released only after proof</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="/static/app.js"></script>
<script>
(async () => {
  const cfg = await config();
  const list = await api("/api/campaigns");
  $("#app").innerHTML = header("home") + `
  <section class="hero">
    ${cfg.sandbox ? '<span class="badge sandbox">PayPal sandbox · test money</span>' : ""}
    <h1>Donate to people, not to promises.</h1>
    <p>Your money waits on PayPal. The volunteer buys the thing, sends the receipt and a photo from the spot —
    and our AI auditor releases the money only when the proof adds up. If it never does, you get a refund.</p>
  </section>
  <div class="grid">${list.map((c) => `
    <a class="card" href="/c/${c.id}" style="color:inherit;text-decoration:none">
      <h3>${esc(c.title)}</h3><div class="place">📍 ${esc(c.place)} · ${esc(c.volunteer_name)}</div>
      <div class="story">${esc(c.story.slice(0, 150))}…</div>${bar(c.totals)}
      <div class="small muted" style="margin-top:8px">${c.tranches.filter((t) => t.status === "paid").length}/${c.tranches.length} tranches released ·
      ${c.status === "active" ? '<span class="badge ok">active</span>' : `<span class="badge ${c.status === "completed" ? "ok" : "bad"}">${c.status}</span>`}</div>
    </a>`).join("")}</div>
  <div class="how">
    <div><span>💙</span><b>1. Donate with PayPal</b>Money is captured to the platform and held, not sent to anyone.</div>
    <div><span>🧾</span><b>2. Volunteer sends proof</b>Receipt + photo of the item in place, from the website or Telegram.</div>
    <div><span>🤖</span><b>3. AI audits it</b>Reads the receipt, converts UAH at the National Bank rate, checks the photo, metadata and reuse.</div>
    <div><span>💸</span><b>4. Money moves</b>Approved → PayPal payout to the volunteer. Nothing → automatic refunds.</div>
  </div>
  <footer>Built for the PayPal AI Hackathon 2026 · Gemini + PayPal Orders, Payouts and Refunds · ${cfg.bot ? `Telegram <a href="https://t.me/${cfg.bot}">@${cfg.bot}</a>` : ""}</footer>`;
})();
</script>
</body>
</html>
